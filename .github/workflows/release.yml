# Release pipeline for f1-points-finish (lesson 04, exercises/quality-gates).
# Job gates: validate data -> train candidate -> quality gates.
# Job promote: waits for approval in the environment "production", then moves @champion.
name: release

on:
  push:
    paths:
      - "exercises/quality-gates/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate file to train and gate"
        type: string
        default: exercises/quality-gates/candidate.yaml

permissions:
  contents: read
  actions: read   # lets the promote job read who approved the deployment

env:
  # Each run uses its own MLflow store in the workspace. The registry travels between
  # the jobs as the workflow artifact "registry".
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  CANDIDATE: ${{ inputs.candidate || 'exercises/quality-gates/candidate.yaml' }}

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exercises/quality-gates/requirements-ci.txt
      - name: Install packages
        run: pip install -r exercises/quality-gates/requirements-ci.txt

      - name: 1. Validate data
        run: python exercises/quality-gates/validate_data.py f1/data/races.csv
      - name: 2. Train candidate
        run: python exercises/quality-gates/train_candidate.py --candidate "$CANDIDATE"
      - name: 3. Quality gates
        run: python -m pytest exercises/quality-gates/test_gates.py -rs --tb=line --junitxml=gate_report.xml

      - name: Gate summary
        if: always()
        run: |
          echo "Candidate file: \`$CANDIDATE\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -f gate_report.md ]; then
            cat gate_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gate report: the pipeline stopped before the gates." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload registry and gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registry
          path: |
            mlflow.db
            mlruns/
            gate_report.*
          if-no-files-found: ignore

  promote:
    name: Promote to champion
    needs: gates
    runs-on: ubuntu-latest
    environment: production   # add yourself as a required reviewer in your fork
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exercises/quality-gates/requirements-ci.txt
      - name: Install packages
        run: pip install -r exercises/quality-gates/requirements-ci.txt
      - name: Download registry and gate report
        uses: actions/download-artifact@v8
        with:
          name: registry

      - name: Find the approver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          approver=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved") | .user.login] | last // empty' || true)
          echo "APPROVER=${approver:-$GITHUB_ACTOR (no review recorded)}" >> "$GITHUB_ENV"
      - name: 4. Promote
        run: python exercises/quality-gates/promote.py --approver "$APPROVER"

      - name: Upload promoted registry
        uses: actions/upload-artifact@v7
        with:
          name: registry-promoted
          path: |
            mlflow.db
            mlruns/
            gate_report.*
